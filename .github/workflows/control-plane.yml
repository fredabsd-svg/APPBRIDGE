name: AppBridge .NET

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: appbridge_test
          POSTGRES_USER: appbridge
          POSTGRES_PASSWORD: appbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appbridge -d appbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__AppBridgeTest: Host=127.0.0.1;Port=5432;Database=appbridge_test;Username=appbridge;Password=appbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/AppBridge.ControlPlane.Tests/AppBridge.ControlPlane.Tests.csproj
      - run: dotnet build tests/AppBridge.ControlPlane.Tests/AppBridge.ControlPlane.Tests.csproj --configuration Release --no-restore
      - run: >-
          dotnet test tests/AppBridge.ControlPlane.Tests/AppBridge.ControlPlane.Tests.csproj
          --configuration Release --no-build --coverlet --coverlet-output-format cobertura
          --coverlet-exclude-by-file '**/Program.cs'
          --coverlet-exclude-by-file '**/Migrations/*.cs'
      - run: python3 scripts/check-coverage.py 80
      - run: dotnet build src/AppBridge.Launcher/AppBridge.Launcher.csproj --configuration Release
