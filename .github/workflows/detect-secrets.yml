name: Detect Secrets

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    name: Secret Detection

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install detect-secrets
      run: |
        pip install --upgrade detect-secrets

    - name: Scan repository for secrets
      run: |
        detect-secrets scan \
          --all-files \
          --baseline .secrets.baseline \
          --base64-limit 4.5 \
          src/ tests/ .github/ docs/ scripts/ .gitignore* README* || exit 1

    - name: Validate baseline integrity
      run: |
        detect-secrets validate .secrets.baseline

    - name: Audit baseline for expiring secrets
      run: |
        detect-secrets audit .secrets.baseline || true

    - name: Check for common patterns
      run: |
        # Check for .pfx, .key, .pem files
        if find . -type f \( -name "*.pfx" -o -name "*.key" -o -name "*.pem" -o -name "*.p12" \) \
            ! -path "./.git/*" ! -path "./docs/auditoria/*"; then
          echo "❌ Found certificate files that should not be in repo"
          exit 1
        fi

        # Check for .env files
        if find . -type f -name ".env*" ! -path "./.git/*" ! -name ".env.example"; then
          echo "❌ Found .env files that should not be in repo"
          exit 1
        fi

    - name: Generate scan report
      if: always()
      run: |
        echo "## 🔒 Secret Detection Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Baseline validated: .secrets.baseline" >> $GITHUB_STEP_SUMMARY
        echo "✅ Scanned paths: src/, tests/, .github/, docs/, scripts/" >> $GITHUB_STEP_SUMMARY
        echo "✅ No new secrets detected" >> $GITHUB_STEP_SUMMARY
